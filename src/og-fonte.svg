    <rect x="10" y="14" width="240" height="330" rx="12" fill="#C93F19" opacity=".16"/>
    <path d="M0 0 h240 v322 l-24-16 -24 16 -24-16 -24 16 -24-16 -24 16 -24-16 -24 16 -24-16 -24 16 Z" fill="url(#papel)"/>
    <rect x="34" y="42"  width="172" height="15" rx="7" fill="#1B1613" opacity=".82"/>
    <rect x="34" y="88"  width="120" height="11" rx="5" fill="#776B62" opacity=".55"/>
    <rect x="34" y="118" width="172" height="3"  rx="1" fill="#776B62" opacity=".30"/>
    <rect x="34" y="146" width="150" height="11" rx="5" fill="#4B423C" opacity=".65"/>
    <rect x="34" y="176" width="104" height="11" rx="5" fill="#4B423C" opacity=".65"/>
    <rect x="34" y="206" width="134" height="11" rx="5" fill="#4B423C" opacity=".65"/>
    <rect x="34" y="240" width="172" height="3"  rx="1" fill="#776B62" opacity=".30"/>
    <rect x="34" y="264" width="70"  height="14" rx="6" fill="#1B1613" opacity=".82"/>
    <rect x="140" y="264" width="66" height="14" rx="6" fill="#E8552A"/>
  </g>
