<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7F3"/>
      <stop offset="1" stop-color="#FFD9C7"/>
    </linearGradient>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3EC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fundo)"/>
  <circle cx="1080" cy="90" r="240" fill="#E8552A" opacity=".10"/>
  <circle cx="1150" cy="560" r="150" fill="#E8552A" opacity=".07"/>

  <!-- texto -->
  <text x="86" y="196" font-family="Sora, Segoe UI, Verdana, sans-serif" font-size="66" font-weight="700" fill="#1B1613">Balcão na Web</text>

  <text x="86" y="278" font-family="Inter, Segoe UI, Verdana, sans-serif" font-size="35" fill="#4B423C">Cardápio digital, painel de pedidos</text>
  <text x="86" y="328" font-family="Inter, Segoe UI, Verdana, sans-serif" font-size="35" fill="#4B423C">e comanda impressa na cozinha.</text>

  <rect x="86" y="392" width="392" height="76" rx="38" fill="#E8552A"/>
  <text x="282" y="440" font-family="Inter, Segoe UI, Verdana, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sem comissão por pedido</text>

  <text x="86" y="546" font-family="Inter, Segoe UI, Verdana, sans-serif" font-size="24" fill="#776B62">balcaonaweb.com.br · Recife</text>

  <!-- comanda saindo, em vetor
       O SVG original usava o emoji 🧾, que nao renderiza em PNG: o
       conversor nao tem fonte de emoji colorido e a imagem saia com um
       quadrado vazio no lugar. -->
